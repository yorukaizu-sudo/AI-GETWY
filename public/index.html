<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Yoru Gateway</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
:root{--ink:#08100e;--pn:#0e1a17;--ln:rgba(216,189,138,.2);--au:#d8bd8a;--iv:#f1ead9;--mu:#8c9a93;--ok:#7fc8a0;--bd:#e0735f}
*{box-sizing:border-box;margin:0}[hidden]{display:none!important}
body{font:14px/1.6 Manrope,system-ui,sans-serif;color:var(--iv);background:radial-gradient(900px 500px at 85% -5%,rgba(216,189,138,.1),transparent 60%),var(--ink);min-height:100vh}
h1,h2,h3,.num,.brand{font-family:Fraunces,Georgia,serif;font-weight:500;letter-spacing:-.01em}
#app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
aside{border-right:1px solid var(--ln);padding:32px 20px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{font-size:26px;color:var(--au);margin-bottom:30px;line-height:1.1}
nav{display:flex;flex-direction:column;gap:4px;flex:1}
nav button,.out{all:unset;cursor:pointer;padding:10px 14px;color:var(--mu);border-left:2px solid transparent;transition:.2s}
nav button:hover,.out:hover{color:var(--iv)}
nav button.on{color:var(--au);border-color:var(--au);background:linear-gradient(90deg,rgba(216,189,138,.1),transparent)}
nav button:focus-visible,.out:focus-visible,.b:focus-visible{outline:2px solid var(--au);outline-offset:2px}
main{padding:44px min(5vw,64px) 80px;max-width:1100px;width:100%}
h1{font-size:clamp(34px,5vw,56px);line-height:1.05;max-width:14em;margin-bottom:28px}
h3{font-size:21px;margin-bottom:10px}
section{margin-top:46px}
.plate{display:flex;gap:14px;align-items:center;flex-wrap:wrap;border:1px solid var(--au);padding:16px 20px;background:rgba(216,189,138,.05);box-shadow:inset 0 0 0 4px var(--ink),inset 0 0 0 5px var(--ln)}
.plate code{flex:1;font-size:17px;color:var(--au);word-break:break-all}
code,.mono,pre{font-family:ui-monospace,Menlo,Consolas,monospace}
.mu{color:var(--mu)}
.stats{display:flex;gap:46px;flex-wrap:wrap;margin-top:38px}
.num{font-size:42px;line-height:1}.stats small{display:block;color:var(--mu);margin-top:6px}
.row{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid var(--ln);flex-wrap:wrap}
.b{cursor:pointer;border:1px solid var(--au);background:var(--au);color:#1a1408;padding:9px 18px;font:600 13px Manrope,sans-serif;transition:.2s}
.b:hover{filter:brightness(1.1)}.b.g{background:transparent;color:var(--au)}.b.g:hover{background:rgba(216,189,138,.12)}.b.sm{padding:2px 10px}
input,select{background:rgba(255,255,255,.04);border:1px solid var(--ln);color:var(--iv);padding:9px 12px;font:inherit;min-width:0}
input:focus,select:focus{outline:none;border-color:var(--au)}select option{background:var(--pn)}
.form{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.form input{flex:1 1 180px}
.chk{display:flex;gap:6px;align-items:center;color:var(--mu)}.chk input{flex:0}
.pill{border:1px solid var(--ln);padding:1px 10px;border-radius:99px;font-size:12px;color:var(--mu)}.ok{color:var(--ok);border-color:var(--ok)}.bad{color:var(--bd);border-color:var(--bd)}
.bar{height:3px;background:var(--ln);margin:8px 0 0 auto;max-width:240px}.bar i{display:block;height:100%;background:var(--au)}
table{width:100%;border-collapse:collapse}th{text-align:left;color:var(--mu);font-weight:500;padding:8px 6px;border-bottom:1px solid var(--ln)}td{padding:8px 6px;border-bottom:1px solid var(--ln)}
.sc{overflow-x:auto}.n2{width:72px}
pre{background:rgba(0,0,0,.35);border:1px solid var(--ln);padding:16px;overflow-x:auto;font-size:12.5px;margin:8px 0 18px}
.note{border:1px solid var(--au);padding:14px 18px;margin:16px 0;background:rgba(216,189,138,.07)}
#login{min-height:100vh;display:grid;place-items:center;text-align:center;padding:24px}
#login .box{max-width:480px}#login h1{margin:0 auto 14px;font-size:clamp(32px,6vw,46px)}#gb{display:flex;justify-content:center;margin:28px 0 14px}
#t{position:fixed;bottom:24px;left:50%;transform:translate(-50%,20px);background:var(--au);color:#1a1408;padding:10px 20px;opacity:0;pointer-events:none;transition:.25s;z-index:9}#t.on{opacity:1;transform:translate(-50%,0)}
@media(max-width:760px){#app{display:block}aside{position:static;height:auto;flex-direction:row;overflow-x:auto;padding:12px;border:0;border-bottom:1px solid var(--ln)}.brand{display:none}nav{flex-direction:row}nav button,.out{white-space:nowrap;border-left:0;border-bottom:2px solid transparent}nav button.on{border-bottom-color:var(--au)}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="login" hidden><div class="box">
  <div class="brand" style="margin-bottom:22px">Yoru Gateway</div>
  <h1>Gerbang pribadi untuk semua model AI.</h1>
  <p class="mu">Masuk dengan akun Google pemilik untuk mengelola provider, model, dan API key.</p>
  <div id="gb"></div>
  <p class="note" id="setup" hidden></p>
</div></div>

<div id="app" hidden>
  <aside>
    <div class="brand">Yoru Gateway</div>
    <nav>
      <button data-t="home">Ringkasan</button><button data-t="prov">Provider</button><button data-t="mod">Model</button>
      <button data-t="keys">API Key</button><button data-t="docs">Dokumentasi</button><button data-t="logs">Log</button>
    </nav>
    <button class="out" onclick="api('logout').then(()=>show(false))">Keluar</button>
  </aside>
  <main id="v"></main>
</div>
<div id="t" role="status"></div>

<script>
const $=s=>document.querySelector(s),CID='';
const E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const N=n=>n==null?'-':new Intl.NumberFormat('en',{notation:'compact',maximumFractionDigits:1}).format(n);
const base=location.origin+'/v1';
const PRE={OpenRouter:'https://openrouter.ai/api/v1',Groq:'https://api.groq.com/openai/v1','Google Gemini':'https://generativelanguage.googleapis.com/v1beta/openai',Cerebras:'https://api.cerebras.ai/v1',Mistral:'https://api.mistral.ai/v1',DeepSeek:'https://api.deepseek.com/v1',SambaNova:'https://api.sambanova.ai/v1',Together:'https://api.together.xyz/v1',NVIDIA:'https://integrate.api.nvidia.com/v1'};
let S,tab='home',q='',NK='',C={},synced=0;

const show=b=>{$('#login').hidden=b;$('#app').hidden=!b};
const T=m=>{const t=$('#t');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),2600)};
async function api(a,d={}){
  const r=await fetch('/api/admin',{method:'POST',headers:{'Content-Type':'application/json','X-Req':'1'},body:JSON.stringify({...d,a})});
  let j={};try{j=await r.json()}catch(e){}
  if(r.status==401&&a!=='login'){show(false);throw 0}
  if(!r.ok)throw new Error(j.error?.message||'Error '+r.status);
  return j}
const act=async(a,d,m)=>{try{await api(a,d);if(m)T(m);await load()}catch(e){e&&T(e.message)}};
async function load(){
  S=(await api('state')).d;show(true);draw();
  if(!synced){synced=1;for(const[i,p]of Object.entries(S.providers))if(!p.synced||S.now-p.synced>21600)api('sync',{id:i}).then(load).catch(()=>{})}
}
const cp=t=>navigator.clipboard.writeText(t).then(()=>T('Tersalin'));
const P=()=>Object.entries(S.providers);
const left=p=>p.rem_tokens!=null?N(p.rem_tokens)+(p.lim_tokens?' dari '+N(p.lim_tokens):'')+' token':p.credit_left!=null?'$'+(+p.credit_left).toFixed(2)+' kredit':p.credit_used!=null?'terpakai $'+(+p.credit_used).toFixed(2):'menunggu request pertama';
const bar=p=>p.rem_tokens!=null&&p.lim_tokens?`<div class=bar><i style="width:${Math.min(100,p.rem_tokens/p.lim_tokens*100)}%"></i></div>`:'';
const active=()=>Object.entries(S.models).filter(([,m])=>m.on&&S.providers[m.p]?.on).sort((a,b)=>b[1].score-a[1].score);
const st=(n,l)=>`<div><div class=num>${n}</div><small>${l}</small></div>`;

const V={
home:()=>{const a=active();return `
 <h1>Satu alamat untuk semua model AI.</h1>
 <div class=plate><code>${base}</code><button class=b onclick="cp('${base}')">Salin Base URL</button></div>
 <p class=mu style="margin-top:12px">Gunakan model <b style="color:var(--iv)">auto</b>: gateway memilih model paling cerdas dan pindah ke berikutnya bila gagal.</p>
 <div class=stats>${st(N(S.stats.req),'request')}${st(N(S.stats.tok),'token terpakai')}${st(P().filter(([,p])=>p.on).length,'provider aktif')}${st(a.length,'model siap')}</div>
 <section><h3>Urutan auto saat ini</h3>${a.slice(0,6).map(([k,m],i)=>`<div class=row><span>${i+1}. <span class=mono>${E(m.id)}</span> <span class=mu>di ${E(S.providers[m.p].name)}</span></span><span class=pill>skor ${m.score}</span></div>`).join('')||'<p class=mu>Belum ada model. Tambahkan provider di menu Provider.</p>'}</section>
 <section><h3>Kuota provider</h3>${P().map(([i,p])=>`<div class=row><div><b>${E(p.name)}</b> <span class="pill ${p.on?'ok':''}">${p.on?'aktif':'mati'}</span><div class=mu>${N(p.used||0)} token dan ${p.reqs||0} request lewat gateway</div></div><div style="text-align:right">Sisa ${left(p)}${bar(p)}</div></div>`).join('')||'<p class=mu>Belum ada provider.</p>'}</section>`},

prov:()=>`<h1>Provider</h1>
 <h3>Tambah atau perbarui provider</h3>
 <div class=form><select id=ps onchange="pre()"><option value="">Preset</option>${Object.keys(PRE).map(k=>`<option>${k}</option>`).join('')}</select>
 <input id=pn placeholder="Nama (nama sama berarti update)"><input id=pu placeholder="Base URL OpenAI-compatible"><input id=pk type=password placeholder="API key provider">
 <label class=chk><input type=checkbox id=pfr>Hanya model gratis</label>
 <button class=b onclick="psave()">Simpan dan detect model</button></div>
 <section>${P().map(([i,p])=>`<div class=row><div><b>${E(p.name)}</b> <span class="pill ${p.on?'ok':''}">${p.on?'aktif':'mati'}</span>
 <div class="mu mono" style="font-size:12px">${E(p.url)}</div><div class=mu>Key ${E(p.key)}</div><div class=mu>${E(p.msg||'')}</div>
 <div>Terpakai ${N(p.used||0)} token, sisa ${left(p)}</div>${bar(p)}</div>
 <div class=form><button class="b g" onclick="act('sync',{id:'${i}'},'Sync selesai')">Sync</button>
 <button class="b g" onclick="act('prov_set',{id:'${i}',on:${!p.on}})">${p.on?'Matikan':'Aktifkan'}</button>
 <button class="b g" onclick="confirm('Hapus provider dan semua modelnya?')&&act('prov_del',{id:'${i}'})">Hapus</button></div></div>`).join('')||'<p class=mu>Belum ada provider. Pilih preset, isi API key, lalu simpan.</p>'}</section>`,

mod:()=>`<h1>Model</h1>
 <h3>Tambah model manual</h3>
 <div class=form><select id=mp>${P().map(([i,p])=>`<option value="${i}">${E(p.name)}</option>`).join('')}</select>
 <input id=mi placeholder="ID model, mis. llama-3.3-70b-versatile"><input id=msc type=number min=1 max=100 value=80 style="flex:0 0 100px" title="Skor kecerdasan 1-100">
 <button class=b onclick="act('model_add',{p:$('#mp').value,id:$('#mi').value,score:+$('#msc').value},'Model ditambah')">Tambah</button></div>
 <section><div class=row style="border:0"><h3>Semua model (${Object.keys(S.models).length})</h3><input placeholder="Cari model" value="${E(q)}" oninput="q=this.value;$('#mt').innerHTML=mrows()"></div>
 <p class=mu>Auto memakai skor tertinggi lebih dulu. Ubah skor untuk mengatur prioritas.</p>
 <div class=sc><table><thead><tr><th>Model<th>Provider<th>Skor<th>Status<th>Aktif<th></thead><tbody id=mt>${mrows()}</tbody></table></div></section>`,

keys:()=>`<h1>API Key</h1>
 <div class=form><input id=kn placeholder="Nama key, mis. aplikasi-saya"><button class=b onclick="knew()">Buat key</button></div>
 ${NK?`<div class=note>Simpan sekarang, key ini tidak akan ditampilkan lagi.<br><code style="word-break:break-all;color:var(--au)">${NK}</code> <button class="b sm" onclick="cp(NK)">Salin</button></div>`:''}
 <section>${S.keys.map(k=>`<div class=row><div><b>${E(k.name)}</b> <code class=mu>${E(k.pre)}</code><div class=mu>${k.use} request, ${N(k.tok)} token, dibuat ${new Date(k.t*1000).toLocaleDateString('id-ID')}</div></div>
 <button class="b g" onclick="confirm('Hapus key ini?')&&act('key_del',{id:'${k.id}'})">Hapus</button></div>`).join('')||'<p class=mu>Belum ada key. Buat satu untuk mulai memanggil gateway.</p>'}</section>`,

docs:()=>{const k='sk-yg-XXXXXXXX';C={
curl:`curl ${base}/chat/completions \\\n  -H "Authorization: Bearer ${k}" \\\n  -H "Content-Type: application/json" \\\n  -d '{"model":"auto","messages":[{"role":"user","content":"Halo!"}]}'`,
py:`from openai import OpenAI\n\nclient = OpenAI(base_url="${base}", api_key="${k}")\nr = client.chat.completions.create(\n    model="auto",\n    messages=[{"role": "user", "content": "Halo!"}],\n)\nprint(r.choices[0].message.content)`,
js:`const r = await fetch("${base}/chat/completions", {\n  method: "POST",\n  headers: { "Authorization": "Bearer ${k}", "Content-Type": "application/json" },\n  body: JSON.stringify({ model: "auto", messages: [{ role: "user", content: "Halo!" }] })\n});\nconsole.log((await r.json()).choices[0].message.content);`};
 return `<h1>Dokumentasi</h1>
 <div class=row><span>Base URL</span><code style="color:var(--au)">${base}</code></div>
 <div class=row><span>Chat</span><code>POST ${base}/chat/completions</code></div>
 <div class=row><span>Daftar model</span><code>GET ${base}/models</code></div>
 <div class=row><span>Autentikasi</span><code>Authorization: Bearer API_KEY</code></div>
 <p class=mu style="margin-top:14px">Isi <code>model</code> dengan <b style="color:var(--iv)">auto</b> untuk urutan otomatis, atau nama model dari <code>/models</code> (format <code>provider/model</code>). Header respons <code>X-Gateway-Model</code> menunjukkan model yang dipakai. Mode <code>stream</code> dikirim sebagai SSE satu potongan.</p>
 <section><h3>curl</h3><pre>${E(C.curl)}</pre><button class="b g" onclick="cp(C.curl)">Salin</button></section>
 <section><h3>Python (OpenAI SDK)</h3><pre>${E(C.py)}</pre><button class="b g" onclick="cp(C.py)">Salin</button></section>
 <section><h3>JavaScript</h3><pre>${E(C.js)}</pre><button class="b g" onclick="cp(C.js)">Salin</button></section>`},

logs:()=>`<h1>Log request</h1><div class=sc><table><thead><tr><th>Waktu<th>Key<th>Model<th>Status<th>Token<th>Durasi<th>Percobaan</thead><tbody>
 ${S.logs.map(l=>`<tr><td>${new Date(l.t*1000).toLocaleTimeString('id-ID')}<td>${E(l.key)}<td class=mono>${E(l.m)}<td><span class="pill ${l.c==200?'ok':'bad'}">${l.c}</span><td>${N(l.tok)}<td>${l.ms} ms<td>${l.n}x`).join('')||'<tr><td colspan=7 class=mu>Belum ada request.'}</tbody></table></div>`
};

const mrows=()=>Object.entries(S.models).filter(([k])=>k.toLowerCase().includes(q.toLowerCase())).sort((a,b)=>b[1].score-a[1].score).slice(0,150).map(([k,m])=>`<tr><td class=mono>${E(m.id)}<td>${E(S.providers[m.p]?.name||m.p)}
 <td><input class=n2 type=number min=1 max=100 value=${m.score} onchange="act('model_set',{k:'${E(k)}',score:+this.value})">
 <td>${m.cool>S.now?`<span class="pill bad">jeda ${Math.ceil((m.cool-S.now)/60)} mnt</span>`:'<span class="pill ok">siap</span>'} <small class=mu>${m.ok} sukses, ${m.fail} gagal</small>
 <td><input type=checkbox ${m.on?'checked':''} onchange="act('model_set',{k:'${E(k)}',on:this.checked})">
 <td><button class="b g sm" aria-label="Hapus model" onclick="act('model_del',{k:'${E(k)}'})">Hapus</button>`).join('')||'<tr><td colspan=6 class=mu>Tidak ada model.';

const pre=()=>{const v=$('#ps').value;if(!v)return;$('#pn').value=v;$('#pu').value=PRE[v];$('#pfr').checked=v==='OpenRouter'};
const psave=()=>act('prov_save',{name:$('#pn').value,url:$('#pu').value,key:$('#pk').value,free:$('#pfr').checked},'Provider tersimpan');
const knew=async()=>{try{NK=(await api('key_new',{name:$('#kn').value||'key'})).key;await load()}catch(e){e&&T(e.message)}};
function draw(){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));$('#v').innerHTML=V[tab]()}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;NK='';draw()});

window.onload=async()=>{
  try{
    const c=await api('cfg');CID=c.cid;
    const miss=[];if(!c.cid)miss.push('GOOGLE_CLIENT_ID');if(!c.secret)miss.push('SESSION_SECRET');if(!c.db)miss.push('Upstash Redis (UPSTASH_REDIS_REST_URL dan UPSTASH_REDIS_REST_TOKEN)');
    if(miss.length){const n=$('#setup');n.hidden=false;n.textContent='Belum diatur di Vercel: '+miss.join(', ')}
    else{const ig=()=>{if(!window.google)return setTimeout(ig,300);
      google.accounts.id.initialize({client_id:CID,callback:async r=>{try{await api('login',{credential:r.credential});await load()}catch(e){e&&T(e.message)}}});
      google.accounts.id.renderButton($('#gb'),{theme:'filled_black',size:'large',shape:'pill',text:'continue_with'})};ig()}
  }catch(e){}
  load().catch(()=>show(false));
  setInterval(()=>{if(!$('#app').hidden&&(tab==='home'||tab==='logs'))load().catch(()=>{})},20000);
};
</script>
</body>
</html>
